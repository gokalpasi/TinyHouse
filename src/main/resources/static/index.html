<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny House Giriş/Kayıt</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <h1>Giriş Yap</h1>
    <form id="loginForm">
        <input type="email" placeholder="E-posta" id="loginEmail" required />
        <input type="password" placeholder="Şifre" id="loginPassword" required />
        <button type="submit">Giriş Yap</button>
    </form>

    <hr />

    <h1>Kayıt Ol</h1>
    <form id="registerForm">
        <input type="text" placeholder="Ad Soyad" id="fullName" required />
        <input type="email" placeholder="E-posta" id="registerEmail" required />
        <input type="password" placeholder="Şifre" id="registerPassword" required />
        <select id="role" required>
            <option value="">Rol Seçin</option>
            <option value="kiraci">Kiracı</option>
            <option value="ev_sahibi">Ev Sahibi</option>
        </select>
        <button type="submit">Kayıt Ol</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
